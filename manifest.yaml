manifestVersion: 1
name: "@vcjdeboer/session-execute"
version: "2026.07.16.1"
description: "Deterministically reproduce a governed data-science run — or replay someone else's captured Claude Science session. The headless runtime of the session-* suite: `run` executes a filled analysis template (R/qmd in a pinned nix R env), `run-targets` a targets pipeline via a harvester, `run-notebook` Python/ipynb via papermill in a locked conda/Docker env — each with the recorder armed and its swamp.returns contract verified. `replay` faithfully re-runs recorded R against frozen tolerance rules (nix preferred, docker fallback), and a Python host-replay shim serves a captured session's host.* calls offline (or falls through to the live API in hybrid mode). Same inputs, same environment, same result — reproducibility you can run, not just cite."
repository: "https://github.com/vcjdeboer/session-execute"

paths:
  base: manifest

models:
  - session_execute.ts

additionalFiles:
  - README.md
  - LICENSE.md

labels:
  - provenance
  - reproducibility
  - data-science
  - nix
  - docker
  - r
  - jupyter
